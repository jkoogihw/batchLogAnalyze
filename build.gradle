plugins {
    id 'java'
    id 'application'
    id 'eclipse'
}

group = 'com.batch'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Gradle 6.x ~ 8.x 및 Eclipse 호환 Main Class 설정
mainClassName = 'com.batch.CheckLog'

application {
    mainClassName = 'com.batch.CheckLog'
}

// 내부망 / 오프라인 환경: 로컬 libs 디렉토리 설정
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // libs 디렉토리 내의 모든 jar 라이브러리 참조
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

// 필요 시 캐시에서 libs 폴더로 jar를 추출하는 유틸리티 태스크
task copyLibs(type: Copy) {
    from configurations.runtimeClasspath
    from configurations.testRuntimeClasspath
    into 'libs'
}

eclipse {
    classpath {
        file {
            whenMerged { classpath ->
                classpath.entries.each { entry ->
                    if (entry.kind == 'lib') {
                        // 내부망 이관 시 절대경로 깨짐 방지를 위해 상대경로(libs/xxx.jar)로 치환
                        def normalizedPath = entry.path.replace('\\', '/')
                        if (normalizedPath.contains('/libs/')) {
                            entry.path = 'libs/' + normalizedPath.substring(normalizedPath.lastIndexOf('/') + 1)
                        }
                    }
                }
            }
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2048m'

    // 개별 테스트 이벤트 콘솔 출력 (성공/실패/스킵)
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // 테스트 스위트 완료 후 종합 통계 요약 출력
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\n" + "=" * 75
            println "  [ JUnit 5 Test Execution Summary ]"
            println "=" * 75
            println "  >> Total Tests : ${result.testCount} tests"
            println "  >> PASSED      : ${result.successfulTestCount} tests"
            println "  >> FAILED      : ${result.failedTestCount} tests"
            println "  >> SKIPPED     : ${result.skippedTestCount} tests"
            println "  >> Elapsed Time: ${(result.endTime - result.startTime) / 1000.0} sec"
            println "=" * 75 + "\n"
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.batch.CheckLog'
    }
}
