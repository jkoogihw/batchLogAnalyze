plugins {
    id 'java'
    id 'application'
}

group = 'com.batch'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'com.batch.CheckLog'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot & Spring Web (2.3.12.RELEASE)
    implementation 'org.springframework.boot:spring-boot-starter:2.3.12.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-web:2.3.12.RELEASE'
    
    // Spring Core / Web (5.2.22.RELEASE)
    implementation 'org.springframework:spring-core:5.2.22.RELEASE'
    implementation 'org.springframework:spring-web:5.2.22.RELEASE'
    
    // Test dependencies (Spring Boot Starter Test 2.3.12 with Vintage excluded & JUnit 5 Jupiter 5.7.2)
    testImplementation('org.springframework.boot:spring-boot-starter-test:2.3.12.RELEASE') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.2'
    testImplementation 'org.junit.platform:junit-platform-commons:1.7.2'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.7.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2048m'

    // 개별 테스트 이벤트 콘솔 출력 (성공/실패/스킵)
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // 테스트 스위트 완료 후 종합 통계 요약 출력
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\n" + "=" * 75
            println "  [ JUnit 5 Test Execution Summary ]"
            println "=" * 75
            println "  >> Total Tests : ${result.testCount} tests"
            println "  >> PASSED      : ${result.successfulTestCount} tests"
            println "  >> FAILED      : ${result.failedTestCount} tests"
            println "  >> SKIPPED     : ${result.skippedTestCount} tests"
            println "  >> Elapsed Time: ${(result.endTime - result.startTime) / 1000.0} sec"
            println "=" * 75 + "\n"
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.batch.CheckLog'
    }
}
